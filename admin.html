<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF6F0">
  <title>Әкімші панелі · Кітап оқу байқауы</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23B84A00'/%3E%3Cpath d='M9 22V10a2 2 0 0 1 2-2h12v12H11a2 2 0 0 0 0 4h12' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin" class="admin guest">

  <!-- Кіру -->
  <div class="login-wrap" id="login-view" hidden>
    <form class="card login-card reveal" id="login-form" novalidate>
      <div class="brand"><span class="brand-mark"><i data-icon="lock"></i></span><span>Әкімші панелі</span></div>
      <h1>Кіру</h1>
      <p class="lead" style="margin-bottom:20px">Ұйымдастырушының құпиясөзін жазыңыз.</p>
      <div class="field" data-field="password">
        <label for="a-pass">Құпиясөз</label>
        <input class="input" id="a-pass" type="password" autocomplete="current-password">
        <p class="error" role="alert"></p>
      </div>
      <button type="submit" class="btn btn-primary btn-xl"><i data-icon="login"></i><span>Кіру</span></button>
    </form>
  </div>

  <!-- Панель -->
  <div class="app" id="admin-view" hidden>
    <aside class="sidebar" id="admin-side"></aside>
    <main class="main">
      <div class="admin-tabs" id="admin-tabs"></div>
      <div class="control-strip" id="control-strip"></div>
      <div id="tab"></div>
    </main>
  </div>

  <noscript><div class="alert alert-err">Панель жұмыс істеуі үшін JavaScript қосулы болуы керек.</div></noscript>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <!-- Жеңіл QR кітапханасы (qrcode.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
