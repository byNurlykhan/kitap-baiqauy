<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>QR плакат</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #E9EDF4; font-family: 'Inter', sans-serif; color: #0B1E3E; }
    .bar { display: flex; gap: 12px; justify-content: center; padding: 16px; }
    .bar button {
      font: inherit; font-size: 18px; font-weight: 700; min-height: 56px; padding: 0 28px;
      border: 0; border-radius: 10px; background: #0B1E3E; color: #fff; cursor: pointer;
    }
    .sheet {
      width: 210mm; min-height: 297mm; margin: 0 auto 24px; padding: 18mm 16mm; background: #fff;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      box-shadow: 0 10px 40px rgba(11, 30, 62, .2);
    }
    .top { width: 100%; height: 6mm; background: #0B1E3E; border-bottom: 2mm solid #C9A84C; margin-bottom: 8mm; }
    .logos { display: flex; align-items: center; justify-content: center; gap: 8mm; margin-bottom: 8mm; }
    .logo-kitap { position: relative; overflow: hidden; height: 24mm; aspect-ratio: 810 / 330; }
    .logo-kitap img { position: absolute; width: 148%; height: auto; max-width: none; left: -23.5%; top: -79%; }
    .logo-sep { width: .4mm; height: 22mm; background: #C5CBD6; }
    .logo-emg { height: 21mm; width: auto; display: block; }
    .eyebrow { font-size: 16pt; font-weight: 700; color: #7A5F14; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 4mm; }
    h1 { font-size: 40pt; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; margin: 0 0 10mm; }
    #qr { padding: 6mm; border: 1.2mm solid #0B1E3E; border-radius: 4mm; }
    #qr img, #qr canvas { display: block; width: 105mm; height: 105mm; }
    .how { font-size: 26pt; font-weight: 800; margin: 10mm 0 6mm; }
    ol { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 4mm; text-align: left; }
    li { display: flex; align-items: center; gap: 6mm; font-size: 18pt; font-weight: 600; padding: 4mm 6mm; border-radius: 3mm; background: #EEF1F7; }
    li b { flex: none; width: 13mm; height: 13mm; border-radius: 3mm; background: #0B1E3E; color: #C9A84C; display: grid; place-items: center; font-size: 18pt; }
    .url { margin-top: auto; padding-top: 8mm; font-size: 12pt; color: #4A5670; word-break: break-all; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar"><button type="button" onclick="window.print()">Басып шығару</button></div>
  <div class="sheet">
    <div class="top"></div>
    <div class="logos"><span class="logo-kitap"><img src="img/logo.jpg" alt="Кітап оқитын ұлт"></span><span class="logo-sep"></span><img class="logo-emg" src="img/emg.png" alt="ЕмбіМұнайГаз"></div>
    <p class="eyebrow">Кітап оқу байқауы</p>
    <h1 id="title">Кітап оқу байқауына қатысыңыз!</h1>
    <div id="qr"></div>
    <p class="how">Телефонның камерасымен оқыңыз</p>
    <ol>
      <li><b>1</b><span>Телефонның камерасын ашыңыз</span></li>
      <li><b>2</b><span>Камераны осы шаршыға бағыттаңыз</span></li>
      <li><b>3</b><span>Экранға шыққан сілтемені басыңыз</span></li>
    </ol>
    <p class="url" id="url"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var url = q.get('u') || location.href.replace(/poster\.html.*$/, '');
      var title = q.get('t');
      if (!/^https?:\/\//i.test(url)) url = location.href.replace(/poster\.html.*$/, '');
      if (title) document.getElementById('title').textContent = title;
      document.getElementById('url').textContent = url;
      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById('qr'), { text: url, width: 800, height: 800, correctLevel: QRCode.CorrectLevel.M });
      } else {
        document.getElementById('qr').textContent = 'QR кітапханасы жүктелмеді. Интернетті тексеріңіз.';
      }
    })();
  </script>
</body>
</html>
